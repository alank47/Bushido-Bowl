<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynasty League Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e1a;
            --bg-secondary: #131829;
            --bg-card: #1a1f35;
            --accent-gold: #ffd700;
            --accent-orange: #ff6b35;
            --accent-green: #00ff88;
            --text-primary: #ffffff;
            --text-secondary: #a0a8c0;
            --border-color: #2a3150;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 107, 53, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 215, 0, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(3rem, 8vw, 7rem);
            letter-spacing: 8px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-orange) 50%, var(--accent-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-transform: uppercase;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
            }
            to {
                filter: drop-shadow(0 0 40px rgba(255, 107, 53, 0.5));
            }
        }

        .subtitle {
            font-size: 1.5rem;
            color: var(--text-secondary);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Login Section */
        .login-section {
            max-width: 500px;
            margin: 40px auto;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .login-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-orange), var(--accent-green));
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-orange);
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }

        select {
            transition: all 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--accent-orange);
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }

        select:hover {
            border-color: var(--accent-gold);
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
            border: none;
            border-radius: 8px;
            color: var(--bg-dark);
            font-family: 'Bebas Neue', cursive;
            font-size: 1.5rem;
            letter-spacing: 3px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        /* Dashboard */
        .dashboard {
            display: none;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .welcome {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .logout-btn {
            width: auto;
            padding: 12px 30px;
            font-size: 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
        }

        .logout-btn:hover {
            border-color: var(--accent-orange);
            background: var(--bg-card);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--accent-orange);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.3);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-orange));
        }

        .stat-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat-value {
            font-family: 'Bebas Neue', cursive;
            font-size: 3.5rem;
            color: var(--accent-gold);
            line-height: 1;
            letter-spacing: 2px;
        }

        .stat-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        /* Leaderboard */
        .leaderboard-section {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .leaderboard-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-orange), var(--accent-green));
        }

        .section-title {
            font-family: 'Bebas Neue', cursive;
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-transform: uppercase;
            color: var(--accent-gold);
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .leaderboard-table thead th {
            text-align: left;
            padding: 15px 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
        }

        .leaderboard-table tbody tr {
            background: var(--bg-secondary);
            transition: all 0.3s ease;
        }

        .leaderboard-table tbody tr:hover {
            background: rgba(255, 107, 53, 0.1);
            transform: scale(1.02);
        }

        .leaderboard-table tbody td {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .leaderboard-table tbody td:first-child {
            border-left: 1px solid var(--border-color);
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }

        .leaderboard-table tbody td:last-child {
            border-right: 1px solid var(--border-color);
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .rank {
            font-family: 'Bebas Neue', cursive;
            font-size: 2rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .rank.first {
            color: var(--accent-gold);
            font-size: 2.5rem;
        }

        .rank.second {
            color: #c0c0c0;
        }

        .rank.third {
            color: #cd7f32;
        }

        .team-name {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .points {
            font-family: 'Bebas Neue', cursive;
            font-size: 2rem;
            color: var(--accent-green);
            font-weight: 700;
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-orange);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 107, 53, 0.2);
            border: 2px solid var(--accent-orange);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            color: var(--accent-orange);
            text-align: center;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
                letter-spacing: 4px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .leaderboard-table {
                font-size: 0.9rem;
            }

            .team-name {
                font-size: 1.1rem;
            }

            .tab-navigation {
                flex-direction: column;
            }

            .tab-btn {
                width: 100%;
            }
        }

        /* Tab Navigation */
        .tab-navigation {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 15px 30px;
            color: var(--text-secondary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            box-shadow: none;
            width: auto;
        }

        .tab-btn:hover {
            color: var(--accent-orange);
            transform: none;
            box-shadow: none;
        }

        .tab-btn.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        /* Historical Stats */
        .historical-stats {
            width: 100%;
        }

        .stat-section {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .stat-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-orange));
        }

        .stat-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .history-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .history-card:hover {
            border-color: var(--accent-orange);
            transform: translateY(-3px);
        }

        .history-card.current-user {
            border-color: var(--accent-gold);
            background: rgba(255, 215, 0, 0.05);
        }

        .card-header {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .card-stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .card-stat-row .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .card-stat-row .stat-value {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .stats-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 20px;
        }

        .stats-table thead th {
            text-align: left;
            padding: 15px 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .stats-table tbody tr {
            background: var(--bg-secondary);
            transition: all 0.2s ease;
        }

        .stats-table tbody tr:hover {
            background: rgba(255, 107, 53, 0.1);
        }

        .stats-table tbody tr.current-user-row {
            background: rgba(255, 215, 0, 0.1);
            border-left: 3px solid var(--accent-gold);
        }

        .stats-table tbody td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .stats-table tbody tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dynasty Dominance</h1>
            <p class="subtitle">5-Year Championship Tracker</p>
        </header>

        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <div class="input-group">
                <label for="username">Sleeper Username</label>
                <input type="text" id="username" placeholder="Enter your username" onkeypress="if(event.key==='Enter') findLeagues()" />
            </div>
            <button onclick="findLeagues()" id="findLeaguesBtn">Find My Leagues</button>
            
            <div id="leagueSelection" style="display: none; margin-top: 30px;">
                <div class="input-group">
                    <label for="leagueSelect">Select Your Dynasty League</label>
                    <select id="leagueSelect" style="width: 100%; padding: 15px 20px; background: var(--bg-secondary); border: 2px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; cursor: pointer;">
                        <option value="">Choose a league...</option>
                    </select>
                </div>
                <button onclick="login()">Enter The Arena</button>
            </div>
            
            <div id="loginError"></div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="dashboard">
            <div class="dashboard-header">
                <div class="welcome">Welcome, <span id="userDisplay"></span></div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-navigation">
                <button class="tab-btn active" onclick="switchTab('overview')">Dynasty Overview</button>
                <button class="tab-btn" onclick="switchTab('historical')">Historical Stats</button>
            </div>

            <!-- Overview Tab -->
            <div id="overviewTab" class="tab-content active">

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Prize Pot Value</div>
                    <div class="stat-value">$<span id="potValue">0</span></div>
                    <div class="stat-subtitle">3.25% APY • Year <span id="currentYear">1</span> of 5</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Your Dynasty Points</div>
                    <div class="stat-value"><span id="userPoints">0</span></div>
                    <div class="stat-subtitle">Wins, playoffs, championships & more</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Your Rank</div>
                    <div class="stat-value">#<span id="userRank">-</span></div>
                    <div class="stat-subtitle">Out of <span id="totalTeams">0</span> teams</div>
                </div>
            </div>

            <!-- Leaderboard -->
            <div class="leaderboard-section">
                <div class="section-title">Dynasty Leaderboard</div>
                <div id="leaderboardContent">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading leaderboard...</p>
                    </div>
                </div>
            </div>
            </div>

            <!-- Historical Stats Tab -->
            <div id="historicalTab" class="tab-content">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const POINTS_PER_WIN = 2;
        const ANNUAL_DEPOSIT = 300;
        const APY = 0.0325;
        
        // Scoring System
        const SCORING = {
            highestWeeklyScore: 0.5,
            regularSeasonWin: 2,
            playoffBerth: 3,
            championshipAppearance: 5,
            titleWin: 8
        };

        // Calculate current pot value with compound interest
        async function calculatePotValue() {
            try {
                const leagueId = sessionStorage.getItem('leagueId');
                const seasons = await fetchAllSeasons(leagueId);
                
                if (!seasons || seasons.length === 0) {
                    return '0.00';
                }
                
                // Get the first season year
                const leagueStartYear = seasons[0].season;
                const currentDate = new Date();
                const currentYear = currentDate.getFullYear();
                const yearsElapsed = currentYear - leagueStartYear;
                
                // Calculate which year of the 5-year cycle we're in
                const cycleYear = Math.min(yearsElapsed + 1, 5);
                
                // Calculate compound interest for each deposit
                let totalValue = 0;
                for (let i = 0; i < cycleYear; i++) {
                    const yearsInvested = cycleYear - i;
                    const depositValue = ANNUAL_DEPOSIT * Math.pow(1 + APY, yearsInvested);
                    totalValue += depositValue;
                }
                
                document.getElementById('currentYear').textContent = cycleYear;
                return totalValue.toFixed(2);
            } catch (error) {
                console.error('Error calculating pot value:', error);
                return '0.00';
            }
        }

        // Sleeper API calls
        async function fetchSleeperUser(username) {
            const response = await fetch(`https://api.sleeper.app/v1/user/${username}`);
            if (!response.ok) throw new Error('User not found');
            return response.json();
        }

        async function fetchUserLeagues(userId, season) {
            const response = await fetch(`https://api.sleeper.app/v1/user/${userId}/leagues/nfl/${season}`);
            if (!response.ok) throw new Error('Failed to fetch leagues');
            return response.json();
        }

        async function fetchLeagueRosters(leagueId) {
            const response = await fetch(`https://api.sleeper.app/v1/league/${leagueId}/rosters`);
            if (!response.ok) throw new Error('League not found');
            return response.json();
        }

        async function fetchLeagueUsers(leagueId) {
            const response = await fetch(`https://api.sleeper.app/v1/league/${leagueId}/users`);
            if (!response.ok) throw new Error('Failed to fetch users');
            return response.json();
        }

        async function findLeagues() {
            const username = document.getElementById('username').value.trim();
            const errorDiv = document.getElementById('loginError');
            const leagueSelection = document.getElementById('leagueSelection');
            const leagueSelect = document.getElementById('leagueSelect');
            const findBtn = document.getElementById('findLeaguesBtn');
            
            errorDiv.innerHTML = '';
            leagueSelection.style.display = 'none';
            
            if (!username) {
                errorDiv.innerHTML = '<div class="error">Please enter your Sleeper username</div>';
                return;
            }

            try {
                findBtn.disabled = true;
                findBtn.textContent = 'SEARCHING...';
                errorDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Finding your leagues...</p></div>';
                
                const user = await fetchSleeperUser(username);
                sessionStorage.setItem('sleeperUser', JSON.stringify(user));
                
                // Get current year and fetch leagues
                const currentYear = new Date().getFullYear();
                const leagues = await fetchUserLeagues(user.user_id, currentYear);
                
                if (!leagues || leagues.length === 0) {
                    throw new Error('No leagues found for this season');
                }
                
                // Clear and populate league dropdown
                leagueSelect.innerHTML = '<option value="">Choose a league...</option>';
                
                leagues.forEach(league => {
                    const option = document.createElement('option');
                    option.value = league.league_id;
                    option.textContent = `${league.name} (${league.total_rosters} teams)`;
                    leagueSelect.appendChild(option);
                });
                
                errorDiv.innerHTML = '';
                leagueSelection.style.display = 'block';
                
            } catch (error) {
                errorDiv.innerHTML = `<div class="error">${error.message}</div>`;
            } finally {
                findBtn.disabled = false;
                findBtn.textContent = 'FIND MY LEAGUES';
            }
        }

        async function login() {
            const leagueId = document.getElementById('leagueSelect').value;
            const errorDiv = document.getElementById('loginError');
            
            errorDiv.innerHTML = '';
            
            if (!leagueId) {
                errorDiv.innerHTML = '<div class="error">Please select a league</div>';
                return;
            }

            try {
                errorDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading dynasty data...</p></div>';
                
                const user = JSON.parse(sessionStorage.getItem('sleeperUser'));
                const rosters = await fetchLeagueRosters(leagueId);
                const users = await fetchLeagueUsers(leagueId);
                
                // Find user's roster
                const userRoster = rosters.find(r => r.owner_id === user.user_id);
                if (!userRoster) {
                    throw new Error('You are not in this league');
                }
                
                // Store session
                sessionStorage.setItem('leagueId', leagueId);
                sessionStorage.setItem('rosters', JSON.stringify(rosters));
                sessionStorage.setItem('users', JSON.stringify(users));
                
                showDashboard();
            } catch (error) {
                errorDiv.innerHTML = `<div class="error">${error.message}</div>`;
            }
        }

        function logout() {
            sessionStorage.clear();
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';

        async function fetchLeague(leagueId) {
            const response = await fetch(`https://api.sleeper.app/v1/league/${leagueId}`);
            if (!response.ok) throw new Error('Failed to fetch league info');
            return response.json();
        }

        async function fetchAllSeasons(currentLeagueId) {
            const seasons = [];
            let leagueId = currentLeagueId;
            let previousLeagueId = null;
            
            // Keep going back until there's no previous league
            while (leagueId && leagueId !== previousLeagueId) {
                const league = await fetchLeague(leagueId);
                const season = parseInt(league.season);
                
                seasons.push({
                    leagueId: leagueId,
                    season: season,
                    league: league
                });
                
                // Store current league ID to prevent infinite loops
                previousLeagueId = leagueId;
                
                // Move to previous season (if it exists)
                leagueId = league.previous_league_id;
                
                // Break if no previous league or we've seen this ID before
                if (!leagueId || leagueId === previousLeagueId) {
                    break;
                }
            }
            
            return seasons.reverse(); // Return chronologically (oldest first)
        }

        async function fetchPlayoffBracket(leagueId) {
            try {
                const response = await fetch(`https://api.sleeper.app/v1/league/${leagueId}/winners_bracket`);
                if (response.ok) {
                    return response.json();
                }
            } catch (err) {
                console.log('Could not fetch playoff bracket');
            }
            return null;
        }

        async function fetchLosersPlayoffBracket(leagueId) {
            try {
                const response = await fetch(`https://api.sleeper.app/v1/league/${leagueId}/losers_bracket`);
                if (response.ok) {
                    return response.json();
                }
            } catch (err) {
                console.log('Could not fetch losers bracket');
            }
            return null;
        }

        async function fetchAllMatchups(leagueId, totalWeeks) {
            const allMatchups = [];
            for (let week = 1; week <= totalWeeks; week++) {
                try {
                    const response = await fetch(`https://api.sleeper.app/v1/league/${leagueId}/matchups/${week}`);
                    if (response.ok) {
                        const weekMatchups = await response.json();
                        allMatchups.push({ week, matchups: weekMatchups });
                    }
                } catch (err) {
                    console.log(`Could not fetch week ${week}`);
                }
            }
            return allMatchups;
        }

                    // Fetch matchups for this season
                    const seasonMatchups = await fetchAllMatchups(seasonLeagueId, 18);
                    
                    // Fetch playoff bracket once for this season

                    // Create roster map for this season
                    const rosterMap = {};
                    seasonRosters.forEach(r => {
                        rosterMap[r.roster_id] = r;
                    });
                    
                    // Process each roster in this season
                    seasonRosters.forEach(roster => {
                        const userId = roster.owner_id;
                        
                        // Initialize if new user (may have joined mid-dynasty)
                        if (!userStats[userId]) {
                            userStats[userId] = {
                                wins: 0,
                                highScores: 0,
                                playoffBerths: 0,
                                championshipAppearances: 0,
                                titles: 0,
                                totalPoints: 0
                            };
                        }
                        
                        // Add wins from this season
                        const wins = roster.settings.wins || 0;
                        userStats[userId].wins += wins;
                        
                        // Count highest weekly scores for this team (REGULAR SEASON ONLY - weeks 1-14)
                        seasonMatchups.forEach(({ week, matchups }) => {
                            if (week <= 14 && matchups && matchups.length > 0) {
                                const maxScore = Math.max(...matchups.map(m => m.points || 0));
                                const rosterMatchup = matchups.find(m => m.roster_id === roster.roster_id);
                                if (rosterMatchup && rosterMatchup.points === maxScore && maxScore > 0) {
                                    userStats[userId].highScores++;
                                }
                            }
                        });
                        
                        // Check playoff berth
                        const sortedByWins = [...seasonRosters].sort((a, b) => {
                            const winsA = a.settings.wins || 0;
                            const winsB = b.settings.wins || 0;
                            if (winsB !== winsA) return winsB - winsA;
                            return (b.settings.fpts || 0) - (a.settings.fpts || 0);
                        });
                        const playoffPosition = sortedByWins.findIndex(r => r.roster_id === roster.roster_id);
                        if (playoffPosition < playoffTeams && wins > 0) {
                            userStats[userId].playoffBerths++;
                        }
                    });
                    
                    // Check championship results using playoff bracket (once per season, outside the roster loop)
                    if (winnersBracket && winnersBracket.length > 0) {
                        // Find the championship game (last round)
                        const championshipRound = Math.max(...winnersBracket.map(m => m.r || 0));
                        const championshipGame = winnersBracket.find(m => m.r === championshipRound);
                        
                        if (championshipGame) {
                            // Find champion roster

                                const runnerUpUserId = rosterMap[runnerUpRosterId].owner_id;
                                if (userStats[runnerUpUserId]) {
                                    userStats[runnerUpUserId].championshipAppearances++;
                                    console.log(`✓ RUNNER-UP: User ${runnerUpUserId}, Roster ${runnerUpRosterId}, Season ${season}`);
                                }
                            }
                        }
                    } else {
                        // Fallback to roster.settings.rank if bracket data unavailable
                        seasonRosters.forEach(roster => {
                            const userId = roster.owner_id;
                            const finalRanking = roster.settings.rank || 0;
                            if (finalRanking === 1 && userStats[userId]) {
                                userStats[userId].titles++;
                                userStats[userId].championshipAppearances++;

                                userStats[userId].championshipAppearances++;
                                console.log(`✓ RUNNER-UP (fallback): User ${userId}, Roster ${roster.roster_id}, Season ${season}`);
                            }
                        });
                    }
                }
                
                console.log('=== FINAL USER STATS ===');
                console.log(userStats);
                
                // Calculate total points for each user
                Object.keys(userStats).forEach(userId => {
                    const stats = userStats[userId];

                        (stats.highScores * SCORING.highestWeeklyScore) +

        function calculateHistoricalStats(allSeasonData, userMap) {
            const stats = {
                championships: {},
                playoffStats: {},
                seasonPerformance: {},
                weeklyDominance: {},
                headToHead: {},
                consistency: {},
                streaks: {},
                funStats: {}
            };

            // Initialize user stats
            Object.keys(userMap).forEach(userId => {
                stats.championships[userId] = { wins: 0, appearances: 0, seasons: [] };
                stats.playoffStats[userId] = { appearances: 0, wins: 0, losses: 0, seeds: [] };
                stats.seasonPerformance[userId] = { bestWins: 0, bestWinPct: 0, bestSeason: null, longestWinStreak: 0, longestLoseStreak: 0 };
                stats.weeklyDominance[userId] = { highScores: 0, highestScore: 0, lowestScore: 999, avgScore: 0, totalScores: [] };
                stats.headToHead[userId] = {};
                stats.consistency[userId] = { scores: [], variance: 0 };
                stats.streaks[userId] = { currentStreak: 0, playoffStreak: 0 };
                stats.funStats[userId] = { shouldveWon: 0, luckyWins: 0, heartbreakLosses: 0 };
            });

            allSeasonData.forEach(seasonData => {
                const { season, rosters, matchups, bracket } = seasonData;
                
                // Championship tracking
                if (bracket && bracket.length > 0) {
                    const championshipRound = Math.max(...bracket.map(m => m.r || 0));
                    const championshipGame = bracket.find(m => m.r === championshipRound);
                    
                    if (championshipGame) {
                        const championRoster = rosters.find(r => r.roster_id === championshipGame.w);
                        const runnerUpRoster = rosters.find(r => r.roster_id === championshipGame.l);
                        
                        if (championRoster) {
                            const userId = championRoster.owner_id;
                            stats.championships[userId].wins++;
                            stats.championships[userId].appearances++;
                            stats.championships[userId].seasons.push(season);
                        }
                        
                        if (runnerUpRoster) {
                            const userId = runnerUpRoster.owner_id;
                            stats.championships[userId].appearances++;
                        }
                    }
                }

                // Process each roster for season stats
                rosters.forEach(roster => {
                    const userId = roster.owner_id;
                    const wins = roster.settings.wins || 0;
                    const losses = roster.settings.losses || 0;
                    const totalGames = wins + losses;
                    const winPct = totalGames > 0 ? wins / totalGames : 0;
                    
                    // Season performance
                    if (wins > stats.seasonPerformance[userId].bestWins) {
                        stats.seasonPerformance[userId].bestWins = wins;
                        stats.seasonPerformance[userId].bestSeason = season;
                    }
                    if (winPct > stats.seasonPerformance[userId].bestWinPct) {
                        stats.seasonPerformance[userId].bestWinPct = winPct;
                    }

                    // Playoff tracking
                    const playoffTeams = 6;
                    const sortedByWins = [...rosters].sort((a, b) => {
                        const winsA = a.settings.wins || 0;
                        const winsB = b.settings.wins || 0;
                        if (winsB !== winsA) return winsB - winsA;
                        return (b.settings.fpts || 0) - (a.settings.fpts || 0);
                    });
                    const seed = sortedByWins.findIndex(r => r.roster_id === roster.roster_id) + 1;
                    
                    if (seed <= playoffTeams && wins > 0) {
                        stats.playoffStats[userId].appearances++;
                        stats.playoffStats[userId].seeds.push(seed);
                    }
                });

                // Process matchups for weekly stats
                matchups.forEach(({ week, matchups: weekMatchups }) => {
                    if (!weekMatchups || weekMatchups.length === 0) return;
                    
                    const maxScore = Math.max(...weekMatchups.map(m => m.points || 0));
                    
                    weekMatchups.forEach(matchup => {
                        const roster = rosters.find(r => r.roster_id === matchup.roster_id);
                        if (!roster) return;
                        
                        const userId = roster.owner_id;
                        const score = matchup.points || 0;
                        
                        if (!stats.weeklyDominance[userId]) return;
                        
                        // Track high scores
                        if (score === maxScore && score > 0) {
                            stats.weeklyDominance[userId].highScores++;
                        }
                        
                        // Track highest/lowest
                        if (score > stats.weeklyDominance[userId].highestScore) {
                            stats.weeklyDominance[userId].highestScore = score;
                        }
                        if (score < stats.weeklyDominance[userId].lowestScore && score > 0) {
                            stats.weeklyDominance[userId].lowestScore = score;
                        }
                        
                        // Track all scores for average
                        stats.weeklyDominance[userId].totalScores.push(score);
                        stats.consistency[userId].scores.push(score);
                    });
                });
            });

            // Calculate averages and variance
            Object.keys(userMap).forEach(userId => {
                const scores = stats.weeklyDominance[userId].totalScores;
                if (scores.length > 0) {
                    const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
                    stats.weeklyDominance[userId].avgScore = avg;
                    
                    // Calculate variance
                    const variance = scores.reduce((sum, score) => sum + Math.pow(score - avg, 2), 0) / scores.length;
                    stats.consistency[userId].variance = Math.sqrt(variance);
                }
            });

            return stats;
        }

                                <th>Most Wins</th>
                                <th>Best Season</th>
                                <th>Best Win %</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            const seasonData = Object.entries(stats.seasonPerformance)
                .filter(([userId]) => userMap[userId])
                .sort((a, b) => b[1].bestWins - a[1].bestWins);
            
            seasonData.forEach(([userId, data]) => {
                const user = userMap[userId];
                const name = user?.display_name || user?.username || 'Unknown';
                const isCurrentUser = userId === currentUserId;
                const winPct = (data.bestWinPct * 100).toFixed(0);
                
                html += `
                    <tr ${isCurrentUser ? 'class="current-user-row"' : ''}>
                        <td>${name}</td>
                        <td>${data.bestWins}</td>
                        <td>${data.bestSeason || '-'}</td>
                        <td>${winPct}%</td>
                    </tr>
                `;
            });
            
            html += `</tbody></table></div>`;

            // Consistency
            html += `
                <div class="stat-section">
                    <h2 class="section-title">🎯 Consistency Rankings</h2>
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Manager</th>
                                <th>Score Variance</th>
                                <th>Type</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            const consistencyData = Object.entries(stats.consistency)
                .filter(([userId]) => userMap[userId] && stats.consistency[userId].variance > 0)
                .sort((a, b) => a[1].variance - b[1].variance);
            
            consistencyData.forEach(([userId, data], index) => {
                const user = userMap[userId];
                const name = user?.display_name || user?.username || 'Unknown';
                const isCurrentUser = userId === currentUserId;
                const type = index < 3 ? 'Consistent' : index >= consistencyData.length - 3 ? 'Volatile' : 'Balanced';
                
                html += `
                    <tr ${isCurrentUser ? 'class="current-user-row"' : ''}>
                        <td>${index + 1}</td>
                        <td>${name}</td>
                        <td>${data.variance.toFixed(1)}</td>
                        <td>${type}</td>
                    </tr>
                `;
            });
            
            html += `</tbody></table></div>`;

            html += '</div>';
            
            historicalTab.innerHTML = html;
        }

        function switchTab(tabName) {
            console.log('Switching to tab:', tabName);
            
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            // Find and activate the clicked button
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => {
                if ((tabName === 'overview' && btn.textContent.includes('Overview')) ||
                    (tabName === 'historical' && btn.textContent.includes('Historical'))) {
                    btn.classList.add('active');
                }
            });
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            
            if (tabName === 'overview') {
                document.getElementById('overviewTab').classList.add('active');
            } else if (tabName === 'historical') {
                const historicalTab = document.getElementById('historicalTab');
                historicalTab.classList.add('active');
                
                // Load historical stats if not already loaded
                const currentContent = historicalTab.innerHTML.trim();
                if (currentContent === '' || currentContent.includes('Content loaded dynamically')) {
                    console.log('Loading historical stats...');
                    loadHistoricalStats();
                } else {
                    console.log('Historical stats already loaded');
                }
            }
        }

        // Check for existing session on load
        window.onload = function() {
            if (sessionStorage.getItem('sleeperUser')) {
                showDashboard();
            }
        };
    </script>
</body>
</html>
